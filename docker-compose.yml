services:
  portainer-agents:
    image: portainer/agent:2.45.2
    environment:
    - AGENT_CLUSTER_ADDR=tasks.portainer-agents
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /var/lib/docker/volumes:/var/lib/docker/volumes
    deploy:
      mode: global
      placement:
        constraints:
        - node.platform.os==linux
      restart_policy:
        condition: any
        delay: 5s
volumes: {}
